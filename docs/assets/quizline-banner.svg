<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Quizline — a C++ foundation with terminal and web editions</title>
  <desc id="desc">Mint lettering on a dark background, with panels identifying the ncurses terminal and React frontend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#192c2f"/><stop offset="1" stop-color="#0b1014"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a9d9cf" stop-opacity=".12"/><stop offset="1" stop-color="#a9d9cf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <ellipse cx="1060" cy="20" rx="360" ry="300" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="19.5" stroke="#b6d9d3" stroke-opacity=".15"/>
  <g transform="translate(50 55) scale(1.05)">
    <path d="M47 32a19 19 0 1 0-19 19" stroke="#c4ded9" stroke-width="7"/>
    <path d="m27 35 9 9 17-19" stroke="#b6d9d3" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <text x="132" y="111" fill="#eef5f3" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-3">quizline</text>
  <text x="56" y="168" fill="#b6d9d3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">One C++ foundation. Two ways to play.</text>
  <text x="56" y="206" fill="#99b0b3" font-family="Arial, Helvetica, sans-serif" font-size="17">Test your knowledge. Track your progress. Beat your best.</text>
  <path d="M56 243H643" stroke="#b6d9d3" stroke-opacity=".18"/>
  <text x="56" y="284" fill="#99b0b3" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.8">SCIENCE  /  HISTORY  /  TECHNOLOGY  /  SPORTS</text>
  <g transform="translate(738 55)">
    <rect width="406" height="104" rx="12" fill="#121e23" stroke="#b6d9d3" stroke-opacity=".25"/>
    <text x="24" y="31" fill="#9fb8b7" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">TERMINAL EDITION</text>
    <text x="24" y="65" fill="#eef5f3" font-family="monospace" font-size="22">$ ./quiz_terminal</text>
    <text x="24" y="88" fill="#83c8bb" font-family="Arial, Helvetica, sans-serif" font-size="12">C++17 + ncurses</text>
    <rect y="122" width="406" height="104" rx="12" fill="#121e23" stroke="#b6d9d3" stroke-opacity=".25"/>
    <text x="24" y="153" fill="#9fb8b7" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">WEB EDITION</text>
    <text x="24" y="187" fill="#eef5f3" font-family="monospace" font-size="22">127.0.0.1:8765</text>
    <text x="24" y="210" fill="#83c8bb" font-family="Arial, Helvetica, sans-serif" font-size="12">React + Python + C++17</text>
  </g>
</svg>
